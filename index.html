function plays(r){let out=[],seen=new Set();A(V(r,'textRelays','relays')).forEach(z=>{let t=A(V(z,'textOptions','options','texts')).map(o=>V(o,'text','textValue','content')).filter(Boolean).join(' ');if(t&&!seen.has(t)){seen.add(t);out.push([V(z,'inning','no','seq','sequence'),t])}});return out.slice(-18).reverse().map((x,i)=>`<div class="play"><span class="inningno">${esc(x[0]??'')}</span><span class="teamtag ${i%2?'blue':'red'}">${i%2?'NC':'한화'}</span><span>${esc(x[1])}</span><span style="text-align:right;color:#8998aa">-</span></div>`).join('')||'<div class="empty">중계 기록이 없습니다.</div>'}
async function loadDetail(id){$('#selectedDetail').innerHTML='<div class="card empty">경기 상세 데이터를 불러오는 중…</div>';try{let [r,g0]=await Promise.all([api(`/schedule/games/${encodeURIComponent(id)}/relay`),api(`/schedule/games/${encodeURIComponent(id)}`)]);let g=g0.game||g0.scheduleGame||g0,c=r.currentGameState||{},away=V(g,'awayTeamName')||'원정',home=V(g,'homeTeamName')||'홈',si=status(g),as=stat(g,r,'away'),hs=stat(g,r,'home'),ing=V(r,'inn','currentInning')??V(g,'currentInning'),half=String(V(r,'homeOrAway')||''),inning=ing?(ing+'회'+(half==='0'?'초':half==='1'?'말':'')):'';let ab=V(r,'awayLineup','awayEntry')||{},hb=V(r,'homeLineup','homeEntry')||{},al=V(ab,'batter','batters'),hl=V(hb,'batter','batters'),aid=V(c,'batter','batterId','currentBatter'),pid=V(c,'pitcher','pitcherId','currentPitcher'),batter=find(String(half)==='0'?al:hl,aid),pitch=find(String(half)==='0'?A(V(hb,'pitcher','pitchers')):A(V(ab,'pitcher','pitchers')),pid),pls=[A(V(ab,'pitcher','pitchers')),A(V(hb,'pitcher','pitchers'))];
$('#selectedDetail').innerHTML=`<div class="detailgrid"><div class="left"><div class="card scorecard"><div class="scoretop"><span class="teamname">${badge(away,true)}${esc(away)}</span><span class="scorebig">${esc(V(c,'awayScore')??score(g,'away'))} : ${esc(V(c,'homeScore')??score(g,'home'))}</span><span class="teamname">${esc(home)}${badge(home,true)}</span><span class="statuspill">${esc(si[1])}</span><span class="inningpill">${esc(inning||'')}</span></div><div class="scoremeta">${esc(V(g,'gameDateTime','startTime','gameTime')||'')} · ${esc(V(g,'stadium','stadiumName')||'')} · 실시간 데이터 연결됨</div></div>
<div class="card panel"><div class="pt">이닝별 스코어</div><div class="pb">${inningTable(r,g)}</div></div>
<div class="card panel"><div class="pt">현재 타석</div><div class="pb"><div class="twocol"><div class="playerbox"><b>타자</b><div class="main">${esc(name(batter))}</div><div class="muted">오늘 타석 기록 · 시즌 타율 ${esc(V(batter,'avg','battingAverage')??'-')}</div></div><div class="pitchbox"><b>투수</b><div class="main">${esc(name(pitch))}</div><div class="muted">투구수 ${esc(V(pitch,'pitchCount','pitches')??'-')} · ERA ${esc(V(pitch,'era','todayEra')??'-')}</div></div></div>${bases(c)}</div></div>
<div class="card panel"><div class="pt">라인업</div><div class="pb"><div class="lineups"><div class="lineupcol"><div class="lineuphead">${esc(away)}</div>${lineup(al)}</div><div class="lineupcol"><div class="lineuphead">${esc(home)}</div>${lineup(hl)}</div></div></div></div></div>
<div class="right"><div class="card panel"><div class="pt">R / H / E / B</div><div class="pb"><div class="teamstat"><div class="teamstathead">${esc(away)}</div><div class="rheb">${['r','h','e','b'].map(k=>`<div class="rh"><b>${esc(as[k]??'-')}</b><span>${k.toUpperCase()}</span></div>`).join('')}</div></div><div class="teamstat"><div class="teamstathead">${esc(home)}</div><div class="rheb">${['r','h','e','b'].map(k=>`<div class="rh"><b>${esc(hs[k]??'-')}</b><span>${k.toUpperCase()}</span></div>`).join('')}</div></div></div></div>
<div class="card panel"><div class="pt">투수</div><div class="pb"><div class="pitchers">${pls.map((ls,i)=>{let p=ls[0];return `<div class="pitcher"><b>${esc(p?name(p):(i?'홈 투수':'원정 투수'))}</b><div>이닝 ${esc(p?V(p,'inn','innings')??'-':'-')} · 투구수 ${esc(p?V(p,'pitchCount','pitches')??'-':'-')}<br>ERA ${esc(p?V(p,'era','todayEra')??'-':'-')} · 탈삼진 ${esc(p?V(p,'kk','strikeouts')??'-':'-')}</div></div>`}).join('')}</div></div></div>
<div class="card panel playspanel"><div class="pt">실시간 중계</div><div class="pb plays">${plays(r)}</div></div></div></div>`}catch(e){$('#selectedDetail').innerHTML=`<div class="card err">상세 데이터를 불러오지 못했습니다.<br><small>${esc(e.message)}</small></div>`}}
function monthButtons(){let a=[['all','전체'],['03','3월'],['04','4월'],['05','5월'],['06','6월'],['07','7월'],['08','8월'],['09','9월'],['10','10월']];$('#monthtools').innerHTML=a.map(x=>`<button class="monthbtn ${allMonth===x[0]?'on':''}" onclick="selectMonth('${x[0]}')">${x[1]}</button>`).join('')}
function dateOf(g){let t=V(g,'gameDateTime','startTime','gameTime','date')||'';let m=String(t).match(/(2026)[-\/.](\d{1,2})[-\/.](\d{1,2})/);return m?`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`:''}function fmtDate(d){let x=new Date(d+'T12:00:00');return `${x.getMonth()+1}.${x.getDate()} (${['일','월','화','수','목','금','토'][x.getDay()]})`}
async function loadAllGames(force=false){currentView='all';if(allCache.length&&!force){renderAll();return}$('#allgamesbody').innerHTML='<div class="card empty">전체 경기 일정을 불러오는 중…</div>';try{let ms=['03','04','05','06','07','08','09','10'];let r=await Promise.all(ms.map(m=>fetchSchedule(`2026-${m}-01`,`2026-${m}-${['04','06','09'].includes(m)?30:31}`)));allCache=unique(r.flat()).sort((a,b)=>dateOf(a).localeCompare(dateOf(b)));renderAll()}catch(e){$('#allgamesbody').innerHTML=`<div class="card err">전체 경기 데이터를 불러오지 못했습니다.<br><small>${esc(e.message)}</small></div>`}}
function renderAll(){monthButtons();let list=allCache.filter(g=>allMonth==='all'||dateOf(g).slice(5,7)===allMonth),groups={};list.forEach(g=>(groups[dateOf(g)]??=[]).push(g));let ks=Object.keys(groups).filter(Boolean).sort().reverse();$('#allgamesbody').innerHTML=ks.length?ks.map(d=>`<section class="daygroup"><div class="dayhead"><b>${fmtDate(d)}</b><span>${groups[d].length}경기</span></div><div class="daygrid">${groups[d].map(g=>gameCard(g)).join('')}</div></section>`).join(''):'<div class="card empty">해당 기간에 등록된 경기가 없습니다.</div>'}
function selectMonth(m){allMonth=m;renderAll()}
async function loadRank(){currentView='rank';try{let r=await api('/statistics/categories/kbo/seasons/2026/teams'),a=A(r.seasonTeamStats||r.teams||r.teamStats||r);$('#rankbody').innerHTML=a.map((x,i)=>`<tr><td><b>${esc(V(x,'ranking','rank','rankNo')??i+1)}</b></td><td><b>${esc(V(x,'teamName','name')||'-')}</b></td><td>${esc(V(x,'gameCount','games')??'-')}</td><td>${esc(V(x,'winGameCount','wins','winCount')??'-')}</td><td>${esc(V(x,'loseGameCount','losses','loseCount')??'-')}</td><td>${esc(V(x,'drawnGameCount','draws','drawCount')??'-')}</td><td>${esc(V(x,'gameBehind','gamesBehind','gameDifference')??'-')}</td><td>${esc(V(x,'wra','winRate','winningRate')??'-')}</td></tr>`).join('')}catch(e){$('#rankbody').innerHTML=`<tr><td colspan="8" class="err">${esc(e.message)}</td></tr>`}}
function show(which){['home','allgames','ranking'].forEach(x=>$('#'+x).classList.add('hidden'));$('#detail')?.classList?.add('hidden');if(which==='home'){$('#home').classList.remove('hidden');loadDate(today())}if(which==='all'){$('#allgames').classList.remove('hidden');loadAllGames()}if(which==='rank'){$('#ranking').classList.remove('hidden');loadRank()}document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));document.getElementById(which==='home'?'gamesTab':which==='all'?'allTab':'rankTab').classList.add('on')}
$('#gamesTab').onclick=()=>show('home');$('#allTab').onclick=()=>show('all');$('#rankTab').onclick=()=>show('rank');makeDays();setClock();setInterval(setClock,1000);loadDate(today());setInterval(()=>{if(currentView==='today'&&!$('#home').classList.contains('hidden'))loadDate(today())},5000);
</script></body></html>

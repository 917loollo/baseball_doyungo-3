<body>

</main>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),A=x=>Array.isArray(x)?x:(x&&typeof x==='object'?Object.values(x):[]),V=(o,...ks)=>{for(const k of ks)if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return null};
function playerList(x){if(Array.isArray(x))return x;if(!x)return[];if(typeof x==='object'){for(const k of ['batter','batters','pitcher','pitchers','players','playerList'])if(Array.isArray(x[k]))return x[k];if(V(x,'pcode','playerId','id','name','playerName'))return[x];}return A(x)}
function pcode(x){return V(x,'pcode','playerId','id','batterId','pitcherId','code')}
function stateFromRelay(r){if(r?.currentGameState)return r.currentGameState;let rel=A(V(r,'textRelays','relays'));for(let i=rel.length-1;i>=0;i--){let opts=A(V(rel[i],'textOptions','options','texts'));for(let j=opts.length-1;j>=0;j--){let st=V(opts[j],'currentGameState','gameState');if(st)return st}}return{}}
function latestBatterRecord(r){let rel=A(V(r,'textRelays','relays'));for(let i=rel.length-1;i>=0;i--){let opts=A(V(rel[i],'textOptions','options','texts'));for(let j=opts.length-1;j>=0;j--){let br=V(opts[j],'batterRecord','batter','batterInfo');if(br&&typeof br==='object')return br}}return null}

const api=async p=>{const r=await fetch('/api/kbo?path='+encodeURIComponent(p),{cache:'no-store'}),t=await r.text();let j;try{j=JSON.parse(t)}catch{throw Error('API 응답을 읽을 수 없습니다')}if(!r.ok)throw Error(j.error||('API '+r.status));return j.result??j};
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const colors={'LG':'#c60c30','두산':'#17213d','삼성':'#0755a5','SSG':'#d41435','KT':'#111','한화':'#ef6418','롯데':'#062a55','KIA':'#e0002a','NC':'#315288','키움':'#570514'};
const short=n=>String(n||'').replace(/ 트윈스| 베어스| 라이온즈| 랜더스| 위즈| 이글스| 자이언츠| 타이거즈| 다이노스| 히어로즈/g,'');
function badge(n,mini=false){let s=short(n),c=colors[s]||'#68798d';return `<span class="${mini?'mini':'badge'}" style="background:${c}">${esc(s.slice(0,3))}</span>`}
function score(g,s){return V(g,s+'TeamScore',s+'Score',s+'ScoreValue')??'-'}
function status(g){let x=String(V(g,'statusCode','status','gameStatus')||'').toUpperCase();if(/RESULT|END|FINAL|FINISH/.test(x))return ['end','경기 종료'];if(/START|LIVE|ING/.test(x))return ['live','LIVE'];return ['pre','경기 예정']}
function valid(g){let a=V(g,'awayTeamName','awayName'),h=V(g,'homeTeamName','homeName');return g?.gameId&&a&&h&&a!=='-'&&h!=='-'&&V(g,'categoryId')==='kbo'}
function unique(a){let m=new Map();A(a).forEach(g=>{if(valid(g))m.set(String(g.gameId),g)});return [...m.values()]}
function gameCard(g,sel=false){let [k,l]=status(g),a=V(g,'awayTeamName'),h=V(g,'homeTeamName'),ing=V(g,'currentInning'),time=V(g,'gameDateTime','startTime','gameTime')||'';return `<article class="gamecard ${sel?'sel':''}" data-game-id="${esc(g.gameId)}" onclick="selectGame('${esc(g.gameId)}')"><div class="gamehead"><span>${esc(time)}</span><span class="${k==='live'?'livec':k==='pre'?'prevc':'endc'}">${k==='live'?'● ':''}${k==='pre'?'':(ing?ing+'회':'')}</span></div><div class="gteams"><div class="gteam">${badge(a)}${esc(short(a))}</div><div><div class="gscore">${esc(score(g,'away'))}:${esc(score(g,'home'))}</div><div class="gstatus ${k==='live'?'livec':k==='pre'?'prevc':'endc'}">${k==='pre'?'예정':k==='end'?'종료':(ing?ing+'회말':'LIVE')}</div></div><div class="gteam">${badge(h)}${esc(short(h))}</div></div></article>`}
let currentView='today',selectedId=null,todayGames=[],allCache=[],allMonth='all';
function setClock(){let d=new Date(),s=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(d).replaceAll('.','');$('#clock').textContent=s}
function makeDays(){let d=new Date();let arr=[];for(let i=-1;i<6;i++){let x=new Date(d);x.setDate(d.getDate()+i);let y=x.getFullYear(),m=String(x.getMonth()+1).padStart(2,'0'),da=String(x.getDate()).padStart(2,'0');let ds=`${y}-${m}-${da}`,w=['일','월','화','수','목','금','토'][x.getDay()];arr.push([ds,`${Number(m)}.${Number(da)} (${w})`])}$('#days').innerHTML='<button class="arrow" onclick="shiftDays(-1)">‹</button>'+arr.map((x,i)=>`<button class="${i===1?'on':''}" data-date="${x[0]}" onclick="loadDate('${x[0]}',this)">${x[1]}</button>`).join('')+'<button class="arrow" onclick="shiftDays(1)">›</button>'}

async function fetchSchedule(from,to){let r=await api(`/schedule/games?upperCategoryId=kbaseball&fromDate=${from}&toDate=${to}`);return unique(r.games||r.scheduleGames||r)}
let loadToken=0,detailToken=0;
function commitHTML(el,html){
  if(!el)return;
  const old=el.innerHTML;
  if(old===html)return false;
  const frag=document.createRange().createContextualFragment(html);
  el.replaceChildren(frag);
  return true;
}
function patchGameCards(list){
  const wrap=$('#games');
  const existing=[...wrap.querySelectorAll('[data-game-id]')];
  const incoming=list.map(g=>String(g.gameId));
  const sameOrder=existing.length===incoming.length&&existing.every((el,i)=>el.dataset.gameId===incoming[i]);
  if(!list.length){ if(!wrap.querySelector('.empty')) commitHTML(wrap,'<div class="card empty">해당 날짜에 등록된 KBO 경기가 없습니다.</div>'); return; }
  if(!sameOrder){ commitHTML(wrap,list.map(g=>gameCard(g,String(g.gameId)===String(selectedId))).join('')); return; }
  list.forEach(g=>{
    const el=wrap.querySelector(`[data-game-id="${CSS.escape(String(g.gameId))}"]`);
    if(!el)return;
    const html=gameCard(g,String(g.gameId)===String(selectedId));
    const tmp=document.createRange().createContextualFragment(html).firstElementChild;
    if(tmp && el.outerHTML!==tmp.outerHTML) el.replaceWith(tmp);
  });
}
async function loadDate(d,btn){
  currentView='today';
  document.querySelectorAll('#days button').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');
  $('#todayLabel').textContent=d===today()?'오늘 경기':d.replaceAll('-','.')+' 경기';
  const firstLoad=!todayGames.length;
  if(firstLoad && !$('#games').querySelector('.gamecard')) $('#games').innerHTML='<div class="card empty">경기 불러오는 중…</div>';
  const token=++loadToken;
  try{
    const fresh=await fetchSchedule(d,d);
    if(token!==loadToken)return;
    const previousSelected=selectedId;
    todayGames=fresh;
    const keep=selectedId&&todayGames.some(g=>String(g.gameId)===String(selectedId));
    if(!keep) selectedId=todayGames[0]?.gameId||null;
    patchGameCards(todayGames);
    if(selectedId) loadDetail(selectedId);
    else if(previousSelected) commitHTML($('#selectedDetail'),'');
  }catch(e){
    if(token!==loadToken)return;
    if(!todayGames.length && !$('#games').querySelector('.gamecard')) $('#games').innerHTML=`<div class="card err">경기 데이터를 불러오지 못했습니다.<br><small>${esc(e.message)}</small></div>`;
  }
}
async function selectGame(id){

  patchGameCards(todayGames);
  loadDetail(id);
}
